[package]
name = "ma-runtime"
version = "0.7.0"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "ma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
ciborium = "0.2"
cid = "0.11"
clap = { version = "4", features = ["derive"] }
extism = "1"
fluent = "0.17"
blake3 = "1"
libp2p-identity = "0.3"
ma-core = { version = "^0.16", default-features = false, features = ["config", "kubo", "iroh", "acl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-cron-scheduler = { version = "0.15", features = ["english"] }
tower-http = { version = "0.7", features = ["cors"] }
time = { version = "0.3", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
unic-langid = "0.9"
# Keep in lockstep with `extism`: we pass a `wasmtime::Config` into
# `extism::PluginBuilder::with_wasmtime_config`, so both crates must resolve
# to the same wasmtime version. Bump `extism` and `wasmtime` together once
# extism ships a release on wasmtime 48 (extism commit d5da297).
wasmtime = "43"
zeroize = "1"

[dev-dependencies]
tracing-test = "0.2"
wat = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true


